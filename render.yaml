databases:
  - name: campusradar-db
    plan: free
    databaseName: campusradar
    user: campusradar

services:
  - type: web
    name: campusradar-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campusradar-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        value: ""
      - key: CORS_ORIGIN_REGEX
        value: ""
      - key: SEED_DEMO_DATA
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: MAX_IMAGES_PER_ITEM
        value: "5"
